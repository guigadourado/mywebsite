*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.gate{min-height:100%;display:grid;place-items:center;padding:max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom))}
.g{display:grid;justify-items:center;gap:28px;width:100%;max-width:300px;opacity:0;transform:translateY(8px);filter:blur(6px);transition:opacity .6s var(--ease),transform .6s var(--ease),filter .6s var(--ease)}
.ready .g{opacity:1;transform:none;filter:none}
.leave .g{opacity:0;transform:scale(.98);filter:blur(6px)}
.hd{text-align:center;display:grid;gap:6px}
.hd h1{margin:0;font:400 32px/1.1 var(--serif);letter-spacing:-.01em}
.hd p{margin:0;color:var(--muted);font-size:14px;text-wrap:balance}
.dots{display:flex;gap:14px;height:12px}
.dots i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--faint);transition:background .15s, box-shadow .15s, transform .25s cubic-bezier(.34,1.56,.64,1)}
.dots i.on{background:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);transform:scale(1.08)}
.bad .dots i{background:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.good .dots i{background:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
.bad .dots{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px}
.pad button{width:72px;height:72px;border-radius:50%;border:0;background:var(--key);color:var(--ink);box-shadow:0 0 0 1px var(--edge);font:400 26px/1 var(--sans);font-variant-numeric:tabular-nums;cursor:pointer;display:grid;place-items:center;transition:background .15s, transform .12s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pad button:hover{background:var(--keyh)}
.pad button:active,.pad button.hit{transform:scale(.92);background:var(--keyh)}
.pad button:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
.pad button.sym{font:400 24px/1 var(--mono);color:var(--muted)}
.del{height:20px;border:0;background:none;color:var(--faint);font:400 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;opacity:0;transition:opacity .2s, color .15s}
.del.on{opacity:1}.del:hover{color:var(--ink)}
.checking{opacity:.5;pointer-events:none}
@media (max-height:640px){.pad{grid-template-columns:repeat(3,62px);gap:10px 20px}.pad button{width:62px;height:62px;font-size:22px}.g{gap:20px}}
@media (prefers-reduced-motion: reduce){.g,.pad button,.dots i{transition:none}.bad .dots{animation:none}}

async function open(pw){

}
const show = html => { document.open(); document.write(html); document.close(); };
let code = '';
const paint = () => { dots.forEach((d, i) => d.classList.toggle('on', i < code.length)); del.classList.toggle('on', code.length > 0); document.querySelector('.dots').setAttribute('aria-label', code.length + ' of ' + LEN + ' entered'); };
async function attempt(){
  g.classList.add('checking');
  try {
    const html = await open(code); ls.set(KEY, code);
    root.classList.add('good'); setTimeout(() => root.classList.add('leave'), 260); setTimeout(() => show(html), 620);
  } catch (e) {
    g.classList.remove('checking'); root.classList.add('bad');
    setTimeout(() => { root.classList.remove('bad'); code = ''; paint(); }, 520);
  }
}
const press = ch => { if (code.length >= LEN || g.classList.contains('checking')) return; code += ch; paint(); if (code.length === LEN) setTimeout(attempt, 120); };
document.querySelectorAll('.pad button').forEach(b => b.addEventListener('click', () => press(b.textContent)));
del.addEventListener('click', () => { code = code.slice(0, -1); paint(); });
addEventListener('keydown', e => {
  if (/^[0-9#*]$/.test(e.key)) { press(e.key); const b = [...document.querySelectorAll('.pad button')].find(x => x.textContent === e.key); if (b) { b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 120); } }
  else if (e.key === 'Backspace') { code = code.slice(0, -1); paint(); }
  else if (e.key === 'Escape') { code = ''; paint(); }
});
/* decryption needs a secure page: on plain http, move to https as soon as it answers, otherwise say why the keypad is waiting */
if (!(window.crypto && crypto.subtle)) {
  const https = 'https://' + location.host + location.pathname + location.search + location.hash;
  if (location.protocol === 'http:') fetch('https://' + location.host + '/', {mode:'no-cors', cache:'no-store'}).then(() => location.replace(https)).catch(() => {});
  document.querySelector('.hd p').textContent = 'The secure connection is still being set up. Try again in a few minutes.';
  document.querySelector('.pad').style.opacity = '.35'; document.querySelector('.pad').style.pointerEvents = 'none';
  requestAnimationFrame(() => root.classList.add('ready'));
  return;
}
/* returning visitors skip the keypad */
const saved = ls.get(KEY);
if (saved) open(saved).then(show).catch(() => root.classList.add('ready')); else requestAnimationFrame(() => root.classList.add('ready'));
})();
</script>
</body>
