<style>
/* Layout: a framed reading column, like an artboard. Hairlines cross the full frame; target marks appear only where a line meets the frame edge. Images sit edge to edge on a 16px mat.
   Motion: blur in on first load, shared element transitions between pages, cursor link previews, Figma style selection on work cards. */
:root{
  --bg:#F6F6F5; --frame:#FCFCFB; --ink:#151515; --muted:#62625F; --faint:#9B9B97; --line:#E3E3E0; --tick:#D6D6D2; --surface:#EFEFED; --hatch:#E4E4E1;
  --accent:#0D99FF; --onaccent:#FFFFFF;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --sans:"Geist", "Helvetica Neue", Arial, sans-serif;
  --mono:"Geist Mono", ui-monospace, Menlo, monospace;
  --col:840px; --pad:40px; --sy:48px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0A0A; --frame:#0F0F0F; --ink:#EDEDEA; --muted:#9A9A96; --faint:#62625F; --line:#222221; --tick:#2C2C2A; --surface:#171716; --hatch:#1F1F1E; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A0A0A; --frame:#0F0F0F; --ink:#EDEDEA; --muted:#9A9A96; --faint:#62625F; --line:#222221; --tick:#2C2C2A; --surface:#171716; --hatch:#1F1F1E; color-scheme:dark}

*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px;border-radius:3px}

.shell{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
.frame{max-width:var(--col);margin:0 auto;background:var(--frame);border-inline:1px solid var(--line);min-height:100vh;position:relative;padding-bottom:env(safe-area-inset-bottom, 0px)}
.sec{padding:var(--sy) var(--pad)}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;padding:18px var(--pad);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:color-mix(in srgb, var(--frame) 86%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
/* Safari: the page runs under the status bar and the floating toolbar. No fixed element touches the bottom edge: Safari 26 turns any fixed
   layer it finds there into a solid toolbar tint, which hides the content running behind its glass controls */
html{background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:30;background:var(--frame)}
@media (hover:none) and (pointer:coarse){.frame{padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 64px)}}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap}
.crumbs a{display:inline-flex;align-items:center;gap:8px;transition:color .15s}.crumbs a:hover,.crumbs a:hover .sep{color:var(--ink)}
.crumbs .sep{flex:none;width:12px;height:12px;color:var(--faint)}
.crumbs [aria-current]{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumbs > *{animation:crumb .4s var(--ease) both}.crumbs > :nth-child(2){animation-delay:.04s}
@keyframes crumb{from{opacity:0;filter:blur(4px);transform:translateX(-4px)}to{opacity:1;filter:none;transform:none}}
@media (max-width:440px){.crumbs .root span{display:none}.crumbs .root{order:-1;padding:6px;margin:-6px 0 -6px -6px}.crumbs .root .sep{transform:scaleX(-1);width:14px;height:14px;color:var(--muted)}}
@media (prefers-reduced-motion: reduce){.crumbs > *{animation:none}}
.nav{display:flex;gap:2px;align-items:center}
.nav button{background:none;border:0;padding:6px 9px;border-radius:6px;color:var(--muted);cursor:pointer;font-size:13px}
.nav button:hover{color:var(--ink);background:var(--surface)}
.nav .theme{display:grid;place-items:center;width:30px;height:30px;padding:0;margin-left:4px}
.nav .theme svg{width:15px;height:15px}

/* one rule for the motif: target marks sit only where a horizontal line crosses the frame edge */
.band{position:relative;background:repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 9px) left top / 100% 1px no-repeat;display:flex;justify-content:space-between;align-items:baseline;padding:var(--sy) var(--pad) 0}
.band span.l{font:400 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.band span.n{font:400 11px/1 var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.band + .sec{padding-top:24px}
.sec:has(+ .links-sec){padding-bottom:0}
.links-sec{padding-top:32px}
.band{scroll-margin-top:calc(env(safe-area-inset-top, 0px) + 72px)}
.reg{position:absolute;width:13px;height:13px;pointer-events:none;
  background:linear-gradient(var(--faint),var(--faint)) center/1px 100% no-repeat, linear-gradient(var(--faint),var(--faint)) center/100% 1px no-repeat}
.reg::after{content:"";position:absolute;inset:3px;border:1px solid var(--faint);border-radius:50%}
.reg.tl{left:-7px;top:-7px}.reg.tr{right:-7px;top:-7px}.reg.bl{left:-7px;bottom:-7px}.reg.br{right:-7px;bottom:-7px}

/* image mat: edge to edge across the frame, a 16px darker gap around the image, marks where its edges meet the frame */
.fig{position:relative;margin-inline:calc(var(--pad) * -1);padding:16px;background:var(--surface);border-block:1px solid var(--line)}
/* a section that ends on an image sits flush on the next section; the image's own edge is the divider */
.sec:has(> .blocks > figure:last-child){padding-bottom:0}
.sec:has(> .blocks > figure:last-child) + .band,.hero-sec + .band{background:none}
.fig .img:not(.slot){background:var(--frame)}
.fig .img img{cursor:zoom-in}
.ico{width:.85em;height:.85em;display:inline-block;vertical-align:-.08em;flex:none}
.b-stats .ico{width:.7em;height:.7em;vertical-align:.02em;stroke-width:1.4}
.next-link .ico{width:.75em;height:.75em}
/* the chapter divider below the cover draws the shared edge, so the cover drops its own */
.fig figcaption{padding-top:14px;text-align:center;font-size:13px;line-height:1.5;color:var(--muted);max-width:60ch;margin-inline:auto;text-wrap:balance}
.card .fig .img img{cursor:pointer}

/* zoom */
.zoom-bg{position:fixed;inset:0;z-index:60;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .3s ease;cursor:zoom-out}
.zoom-bg.on{opacity:1}
.zoom-cap{position:fixed;left:50%;z-index:62;transform:translateX(-50%);margin:0;max-width:min(560px, calc(100vw - 48px));font-size:13px;line-height:1.5;color:var(--muted);text-align:center;text-wrap:balance;opacity:0;transition:opacity .3s ease}
.zoom-cap:empty{display:none}
.zoom-cap.on{opacity:1}.zoom-cap.swap{opacity:0;transition:opacity .14s ease}
.zoom-nav{position:fixed;top:50%;z-index:62;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;cursor:pointer;color:var(--frame);
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.04) 55%,rgba(255,255,255,.10)),color-mix(in srgb, var(--ink) 66%, transparent);
  -webkit-backdrop-filter:blur(18px) saturate(1.9);backdrop-filter:blur(18px) saturate(1.9);border:1px solid rgba(255,255,255,.24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 1px rgba(255,255,255,.12),0 10px 26px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.16);
  opacity:0;transform:translateY(-50%) scale(.9);transition:opacity .3s ease, transform .35s cubic-bezier(.34,1.56,.64,1)}
.zoom-nav.l{left:max(16px, env(safe-area-inset-left, 0px))}.zoom-nav.r{right:max(16px, env(safe-area-inset-right, 0px))}
.zoom-nav.on{opacity:1;transform:translateY(-50%) scale(1)}
.zoom-nav.on:hover{transform:translateY(-50%) scale(1.08)}.zoom-nav.on:active{transform:translateY(-50%) scale(.94)}
.zoom-nav:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.zoom-nav svg{width:16px;height:16px}
@media (max-width:640px){.zoom-nav{top:auto;bottom:max(16px, env(safe-area-inset-bottom, 0px));transform:scale(.9)}.zoom-nav.on{transform:none}.zoom-nav.on:hover{transform:scale(1.08)}}
.zoom-img.swap{opacity:0;transition:opacity .14s ease}

.zoom-img{position:fixed;z-index:61;object-fit:contain;cursor:zoom-out;transition:left .42s var(--ease),top .42s var(--ease),width .42s var(--ease),height .42s var(--ease)}

/* type */
h1.name{font:400 44px/1.1 var(--serif);letter-spacing:-.01em;margin:0 0 6px}
.role{margin:0;font-weight:500}
.who{display:flex;align-items:center;gap:20px}
.av{--rx:0deg;position:relative;width:96px;height:96px;flex:none;display:block}
.av-bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.av-clip{position:absolute;left:-20%;right:-20%;top:-30%;bottom:0;-webkit-mask:linear-gradient(#000,#000) 83.3% 0/70% 61.5% no-repeat,radial-gradient(closest-side,#000 98%,transparent 100%) bottom/71.43% 76.92% no-repeat;mask:linear-gradient(#000,#000) 83.3% 0/70% 61.5% no-repeat,radial-gradient(closest-side,#000 98%,transparent 100%) bottom/71.43% 76.92% no-repeat;pointer-events:none}
.av-me{position:absolute;left:14.29%;width:71.43%;top:16.4%;height:auto;display:block}
.av::before{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 4px #FCFCFC,0 8px 18px rgba(0,0,0,.16)}
.av-bg{border-radius:50%;transition:filter .4s var(--ease)}
.av-me{transform-origin:50% 96%;transition:transform .45s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.who:hover .av-me,.av:focus-within .av-me{transform:translateY(-3px) scale(1.12) rotate(var(--rx))}
.who:hover .av-bg{filter:brightness(.82) saturate(1.1)}
@media (max-width:640px){.av{width:72px;height:72px}}
@media (prefers-reduced-motion: reduce){.av-me,.av-bg{transition:none}.who:hover .av-me{transform:none}}
.zoom-img.framed{border-radius:8px;outline:1px solid rgba(255,255,255,.08);outline-offset:-1px}

.who .me{width:96px;height:96px;flex:none;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.12))}
@media (max-width:640px){.who{gap:14px}.who .me{width:72px;height:72px}}
.intro{margin:20px 0 0;color:var(--muted);text-wrap:pretty}
.muted{color:var(--muted)}
.mention{color:var(--ink);border-bottom:1px solid var(--line);transition:border-color .2s;cursor:pointer;white-space:nowrap}
.mention:hover{border-color:var(--ink)}
.mention .arr{color:var(--faint);margin-left:2px}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.pill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid transparent;font-size:13px;cursor:pointer;transition:border-color .2s}
.pill:hover{border-color:var(--line)}
.pill.ghost{background:none;border-color:var(--line);color:var(--muted)}
.pill.ghost:hover{color:var(--ink);border-color:var(--faint)}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:18px}
.status i{width:6px;height:6px;border-radius:50%;background:#3FA66B}

/* work cards with selection twist */
.cards{display:grid;gap:36px}
.card{display:grid;gap:14px}
.sel{position:relative}
.sel .box{position:absolute;inset:-3px;border:1px solid var(--accent);opacity:0;transition:opacity .15s, inset .25s var(--ease);pointer-events:none}
.sel .box i{position:absolute;width:7px;height:7px;background:var(--frame);border:1px solid var(--accent)}
.sel .box i:nth-child(1){left:-4px;top:-4px}.sel .box i:nth-child(2){right:-4px;top:-4px}.sel .box i:nth-child(3){left:-4px;bottom:-4px}.sel .box i:nth-child(4){right:-4px;bottom:-4px}
.sel .dim{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font:400 11px/1 var(--mono);background:var(--accent);color:var(--onaccent);padding:4px 6px;border-radius:3px;opacity:0;transition:opacity .15s;white-space:nowrap;font-variant-numeric:tabular-nums}
.card:hover .box,.card:focus-visible .box,.sel:hover .box{opacity:1;inset:-6px}
.card:hover .dim,.card:focus-visible .dim,.sel:hover .dim{opacity:1}
.sel .dim{pointer-events:none}
.card:focus-visible{outline:none}
.card .fig + .card-head{margin-top:22px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.card h3{font:400 24px/1.25 var(--serif);margin:0;letter-spacing:-.005em;width:fit-content}
.card .meta{font-size:13px;color:var(--muted);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.card p{margin:0;color:var(--muted);text-wrap:pretty}
.outcomes{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.outcomes span::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--faint);margin-right:8px;vertical-align:middle}
.lock{display:inline-flex;align-items:center;gap:4px}
.lock svg{width:11px;height:11px}

/* rows with sibling dimming */
.rows{display:grid}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:baseline;padding-block:12px;border-top:1px solid var(--line);transition:opacity .15s var(--ease)}
.row:last-child{border-bottom:1px solid var(--line)}
.rows:hover .row:not(:hover){opacity:.42}
.row .t{font-weight:500}
.row .d{color:var(--muted)}
.row .ab{display:block;margin-top:6px;text-wrap:pretty;font-size:13px;line-height:1.55;color:var(--muted)}
.row.xp{grid-template-areas:"t y" "d d" "ab ab";row-gap:0}
.row.xp .t{grid-area:t}.row.xp .y{grid-area:y}.row.xp .d{grid-area:d}.row.xp .ab{grid-area:ab}
.row .y{font:400 11px/1 var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.row .arrow{color:var(--faint);margin-left:4px}

/* images and slots */
.img{position:relative;width:100%;max-width:100%;border-radius:0;overflow:hidden;background:var(--surface)}
.img img{display:block;width:100%;height:100%;object-fit:cover}
.img::before{content:"";position:absolute;inset:0;background:var(--lq, none) center/cover;filter:blur(16px);transform:scale(1.1)}
.img img,.itv-stage figure{position:relative}
.img img{opacity:0;transition:opacity .45s var(--ease)}.img img.ld{opacity:1}
@media (prefers-reduced-motion: reduce){.img img{transition:none}}
.slot{background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--hatch) 10px 11px);border:1px solid var(--line);display:grid;place-items:center;text-align:center;padding:16px}
.slot span{font:400 11px/1.5 var(--mono);letter-spacing:.04em;color:var(--muted);background:var(--frame);padding:6px 10px;border-radius:6px;max-width:80%}
figure{margin:0;display:grid;gap:10px}
figcaption{font-size:13px;color:var(--muted)}

/* case page */
.back{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--ink)}
.case-head{margin:0;display:grid;gap:10px}
.eyebrow{font:400 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0}
.case-head h1{font:400 clamp(32px,6vw,44px)/1.08 var(--serif);letter-spacing:-.015em;margin:0;text-wrap:balance;width:fit-content}
.case-head .sum{font-size:18px;line-height:1.5;color:var(--muted);margin:4px 0 0;max-width:46ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:16px;margin-top:24px}
.facts div{display:grid;gap:2px;min-width:0}
.facts dt{font:400 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.facts dd{margin:0;font-size:15px}
.blocks{display:grid;gap:32px}
.b-todo h2{font:500 15px/1.4 var(--sans);margin:0 0 8px}
.b-text h2{font:400 24px/1.2 var(--serif);letter-spacing:-.01em;margin:0 0 12px;text-wrap:balance}
.b-text.has-h:not(:first-child){padding-top:16px}
.b-note{max-width:62ch;font-size:13px;line-height:1.6;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.b-note b{font-weight:500;color:var(--ink)}
.case-stats{margin-top:32px}
.spec{margin-top:32px;border-top:1px solid var(--line)}
.spec-stats,.spec-facts{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:24px;align-items:start}
.spec-stats{padding-block:24px}
.spec-stats div{display:grid;gap:8px;align-content:start}
.spec-stats b{font:400 32px/1 var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.spec-stats span{font-size:13px;line-height:1.45;color:var(--muted)}
.spec-facts{margin:0;padding-top:16px;border-top:1px dashed var(--line)}
.spec-facts div{display:grid;gap:4px;align-content:start;min-width:0}
.spec-facts dt{font:400 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.spec-facts dd{margin:0;font-size:14px;line-height:1.45}
@media (max-width:640px){.spec-stats{grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:16px}.spec-stats b{font-size:26px}.spec-facts{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:16px}}
.b-text p{margin:0 0 12px;max-width:62ch}
.b-text p:last-child{margin-bottom:0}
.b-list{display:grid;border-top:1px solid var(--line)}
.b-list div{display:grid;grid-template-columns:minmax(90px,1fr) minmax(0,3fr);gap:16px;align-items:baseline;padding-block:10px;border-bottom:1px solid var(--line)}
.b-list span:first-child{color:var(--muted)}
.b-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:16px}
.b-stats b{display:block;font:400 32px/1 var(--serif);font-variant-numeric:tabular-nums}
.b-stats span{font-size:13px;color:var(--muted)}
.b-quote{margin:0;padding-left:18px;border-left:1px solid var(--ink)}
.b-quote p{font:400 18px/1.5 var(--serif);margin:0 0 8px}
.b-quote cite{font-style:normal;font-size:13px;color:var(--muted)}
.b-todo{border:1px dashed var(--faint);border-radius:10px;padding:16px 18px}
.b-todo .tag{font:400 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:10px}
.b-todo p{margin:0;color:var(--muted)}
.links{display:flex;gap:16px;flex-wrap:wrap}
.links a{border-bottom:1px solid var(--line)}
.links a:hover{border-color:var(--ink)}
.next-link{font:400 24px/1.2 var(--serif);display:inline-flex;gap:10px;align-items:center}
.next-link span{transition:transform .25s var(--ease)}
.next-link:hover span{transform:translateX(4px)}

/* gate */
.gate{border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:12px;background:var(--surface)}
.gate h2{font:500 15px/1.4 var(--sans);margin:0;display:flex;gap:8px;align-items:center}
.gate h2 svg{width:14px;height:14px}
.gate p{margin:0;color:var(--muted);font-size:13px}
.gate form{display:flex;gap:8px;flex-wrap:wrap}
.gate label{flex-basis:100%;font:400 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.gate input{flex:1 1 200px;min-width:0;height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--frame);color:var(--ink);font:inherit}
.gate input:focus{outline:1.5px solid var(--accent);outline-offset:0}
.btn{height:38px;padding:0 16px;border-radius:8px;border:0;background:var(--ink);color:var(--frame);font:500 13px var(--sans);cursor:pointer}
.btn:disabled{opacity:.5}
.err{font-size:13px;color:#C2410C}
.shake{animation:shake .3s}
@keyframes shake{30%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
.fade{animation:enter .5s var(--ease) both}

/* footer */
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:24px var(--pad);background:repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 9px) left top / 100% 1px no-repeat}
.foot a:hover{color:var(--ink)}
.foot-r{display:grid;gap:4px;justify-items:end;text-align:right;margin-left:auto}
.foot-r small{font-size:12px;color:var(--faint)}

/* link preview card */
.pv{position:fixed;left:0;top:0;z-index:50;width:280px;padding:4px;border-radius:4px;background:var(--frame);box-shadow:0 0 0 1px var(--line), 0 18px 40px rgba(0,0,0,.14);pointer-events:none;opacity:0;transform:scale(.94) translateY(6px);transform-origin:top left;transition:opacity .16s ease, transform .28s var(--ease);will-change:left,top}
.pv.on{opacity:1;transform:none}
.pv .img{border-radius:0;aspect-ratio:16/10}
.pv .cap{display:flex;justify-content:space-between;gap:8px;padding:8px 6px 4px;font-size:13px}
.pv .cap span:last-child{font-family:var(--mono);font-size:13px;color:var(--faint);align-self:center}

/* motion */
@keyframes enter{from{opacity:0;filter:blur(6px);transform:translateY(8px)}to{opacity:1;filter:none;transform:none}}
.boot .enter{animation:enter .55s var(--ease) both;animation-delay:calc(var(--i, 0) * 70ms)}
::view-transition-group(*){animation-duration:.5s;animation-timing-function:var(--ease)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.28s}
.draft{position:fixed;left:max(16px, env(safe-area-inset-left, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));font:400 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--frame);padding:8px 10px;border-radius:6px;z-index:40}


@media (max-width:560px){
  :root{--pad:18px}
  h1.name{font-size:32px}
  .card-head{flex-direction:column;gap:4px}
  .nav button[data-go="lab"]{display:none}
}

 Country","time":"2:37","art":"assets/np/my-garage.webp"},{"title":"Redbone","artist":"Childish Gambino","album":"\"Awaken, My Love!\"","time":"5:27","art":"assets/np/redbone.webp"},{"title":"Wow Freestyle (feat. Kendrick Lamar)","artist":"Jay Rock, Kendrick Lamar","album":"Redemption","time":"2:55","art":"assets/np/wow-freestyle.webp"},{"title":"Navigating","artist":"Twenty One Pilots","album":"Clancy","time":"3:43","art":"assets/np/clancy.webp"},{"title":"Lane Boy","artist":"Twenty One Pilots","album":"Blurryface","time":"4:13","art":"assets/np/lane-boy.webp"},{"title":"Car Radio","artist":"Twenty One Pilots","album":"Vessel","time":"4:27","art":"assets/np/car-radio.webp"},{"title":"RAWFEAR","artist":"Twenty One Pilots","album":"Breach","time":"3:20","art":"assets/np/rawfear.webp"},{"title":"Saturday","artist":"Twenty One Pilots","album":"Scaled And Icy","time":"2:52","art":"assets/np/scaled-and-icy.webp"},{"title":"Routines In The Night","artist":"Twenty One Pilots","album":"Clancy","time":"3:23","art":"assets/np/clancy.webp"},{"title":"Shy Away","artist":"Twenty One Pilots","album":"Scaled And Icy","time":"2:55","art":"assets/np/scaled-and-icy.webp"}]},"projects":[{"slug":"beatstars-projects","kind":"case","title":"Projects","client":"BeatStars","year":"2026","summary":"Designing the home for everything behind a song, from the first wireframe to general availability.","outcomes":["1,700+ projects in three weeks","93% core task completion","Live on every plan, Sep 2026"],"role":"Lead designer","platform":"Web, mobile next","locked":false,"cover":{"src":"assets/bsp-cover.webp","alt":"BeatStars Projects: Every file. Every version. Every credit. One project. The project screen for MF DOOM HM.. FOOD? with versioned files, collaborators and credits","ratio":"16/10"},"blocks":[{"type":"chapter","label":"Context"},{"type":"text","heading":"One home for everything behind a song","body":["A song’s files are usually scattered across Dropbox, drives, chats and email, and nothing proves who made what. Projects keeps every file, version and collaborator in one place, and records each upload and agreed split as the work happens."]},{"type":"text","heading":"My role","body":["I was the only designer on a team with a product manager and four engineers, two front end and two back end. I led design from the first PRD to launch: the product and interface, a rebuilt design system underneath, prototypes in the real codebase, and the QA that got it shipped."]},{"type":"chapter","label":"Process"},{"type":"text","body":["The first round was wireframes in Figma Make, with no visual intent, to settle the structure: projects, files, versions and sharing. The second was a first build on shadcn. It was solid and fast to ship, but it felt sterile and basic for a creative audience.","Producers live in DAWs, not dashboards. So for the third round I kept the information architecture that worked and rebuilt the visual language, and the system under it, for a creative audience. That direction, Origin, brought a vinyl player, DAW style brushed buttons and three levels of surface depth, and was approved in a leadership presentation."],"heading":"Three versions of the same screen"},{"type":"iterations","items":[{"label":"Wireframe","src":"assets/bsp-it1.webp","alt":"Iteration 1: grayscale wireframe of a project page with a file table and a settings sidebar","caption":"Structure first, no visual intent."},{"label":"shadcn build","src":"assets/bsp-it2.webp","srcDark":"assets/bsp-it2-dark.webp","alt":"Iteration 2: the first build on shadcn, a clean but generic project page with a file table and details panel","caption":"Fast to ship, but sterile."},{"label":"Origin","src":"assets/bsp-it3.webp","srcDark":"assets/bsp-it3-dark.webp","alt":"Iteration 3: Origin, the project page with a vinyl record behind the artwork, brushed buttons, layered surfaces and a waveform player","caption":"Origin: built for how producers work."}]},{"type":"text","body":["Once the concepts were approved in Figma, I cloned the product repository and implemented them with Claude Code, which gave us a live prototype with real interactions and real data. Seeing the direction work with real data validated it faster than any static frame, and closed most of the gap between spec and implementation.","AI sped up the volume work: audits, migrations, synthesis and prototypes. The calls stayed with design. I set how components map to code before any automation ran, and when AI flagged intentional decisions as bugs, I overrode them so the system kept its character."],"heading":"Designing in the real product"},{"type":"chapter","label":"Decisions"},{"type":"text","body":["I rebuilt the design system underneath the product so every screen after it would be faster and more consistent. I unified three typography namespaces into one and verified 48 styles, cleaned ghost bindings out of three libraries and mapped components to code with Code Connect. I also built a pipeline that scans, cleans and optimizes new icons added in Figma and publishes them as a package engineering installs from GitHub, built with GitHub Actions and paired with an icon library visualizer.","Alongside these improvements, I built a Figma plugin that scans existing designs still bound to the old libraries and moves them onto the new ones, matching typography, color and component variables by similarity and scale."],"heading":"Origin, a design system rebuilt for Projects"},{"type":"stats","items":[{"value":"285","label":"tokens as JSON, CSS and Tailwind"},{"value":"3 → 1","label":"typography namespaces"},{"value":"1,000+","label":"icons through my pipeline"}]},{"type":"text","body":["Every component property in Figma maps one to one to its code. Change any property to see the component and the code it ships as."]},{"type":"component","name":"Button","library":"Origin DS","file":"button.tsx","import":"@/ui/button","icon":"PlusIcon","iconImport":"@origin/icons","variants":[{"key":"primary-flat","lab ","layers":{"default":"bg-glass-dark text-white edge-glass backdrop-blur-2xl","hover":"hover:bg-glass-dark-hover","active":"active:bg-glass-dark-pressed","disabled":"disabled:bg-glass-muted disabled:text-white/32","focus":"focus-visible:ring-2 focus-visible:ring-focus focus-visible:ring-offset-2"}},{"key":"tertiary-flat","label":"Tertiary / Flat","ref":"variant.tertiaryFlat","layers":{"default":"bg-mode/4 text-default border border-mode/12","hover":"hover:bg-mode/8 hover:shadow-xs","active":"active:bg-mode/12","disabled":"disabled:bg-muted disabled:text-subtle disabled:shadow-none","focus":"focus-visible:ring-2 focus-visible:ring-focus focus-visible:ring-offset-2"}},{"key":"ghost","label":"Ghost","ref":"variant.ghost","layers":{"default":"bg-transparent text-default","hover":"hover:bg-mode/4","active":"active:bg-mode/12","disabled":"disabled:bg-muted disabled:text-subtle disabled:shadow-none","focus":"focus-visible:ring-2 focus-visible:ring-focus focus-visible:ring-offset-2"}},{"key":"destructive","label":"Destructive","ref":"variant.destructive","layers":{"default":"bg-danger text-white border border-white/40","hover":"hover:bg-danger-hover hover:shadow-xs","active":"active:bg-danger-hover","disabled":"disabled:bg-muted disabled:text-subtle disabled:shadow-none","focus":"focus-visible:ring-2 focus-visible:ring-focus focus-visible:ring-offset-2"}}],"sizes":[{"key":"lg","ref":"size.lg","classes":"h-11 px-3 gap-2 rounded-xl text-sm font-medium"},{"key":"sm","ref":"size.sm","classes":"h-9 px-3 gap-1 rounded-xl text-sm font-medium"}],"round":{"lg":"size-11 rounded-full","sm":"size-9 rounded-full"}},{"type":"text","heading":"The Record and Splits: provenance on every track","body":["The Record lives on each track: an append only log of every upload, version, comment, collaborator, rename and deletion, across 11 event types. Nobody can edit or delete an entry, and the history carries over wherever the track goes.","Splits sit on the same track. They started as a flat editable field, and the PRD asked for contract grade proof: every party ratifies, server timestamps, a hash chained ledger and a PDF record of agreement. I built a six step interactive prototype: edit, review the proposal with before and after, send, notify, and each collaborator approves or declines independently. Every change lands in the Record."]},{"type":"record","title":"my_garage.mp3","splits":[{"label":"Composition","version":"Version 1.0","status":"Verified","verified":true,"people":[["Jordan Lee","Songwriter","jordan@example.com","40%",true],["Sam Ortiz","Producer","sam@example.com","30%",true],["Nova Keys","Composer","nova@example.com","20%",true],["Ray Castillo","Lyricist","ray@example.com","10%",true]]},{"label":"Sound recording","version":"Version 2.0","status":"Pending confirmation","verified":false,"people":[["Sam Ortiz","Producer","sam@example.com","50%",true],["Jordan Lee","Artist","jordan@example.com","35%",true],["Mia Chen","Mix engineer","mia@example.com","15%",false]]}],"filters":[{"label":"Event type","options":[["Comments","2"],["New versions","3"],["Splits","2"],["Verifications","2"],["Collaborators",""],["Renames",""],["Deletions",""]]},{"label":"Date","options":[["Today",""],["Last 7 days",""],["Last 30 days",""],["All time",""]]},{"label":"Done by","options":[["Jordan Lee","4"],["Sam Ortiz","4"],["Mia Chen","1"],["Verification","2"]]}],"events":[["Comment added: “@samortiz Much better! I like where this is going!”","Jan 02, 2026, 8:22 AM","by Jordan Lee"],["Sound recording splits proposed (v2.0)","Jan 02, 2026, 8:05 AM","by Sam Ortiz"],["Comment added: “@jordan, check out this updated version I just finished”","Jan 01, 2026, 3:34 PM","by Sam Ortiz"],["New version added (v3)","Jan 01, 2026, 3:34 PM","by Sam Ortiz"],["Composition splits verified (v1.0)","Jan 01, 2026, 3:14 PM","5b7c2e90"],["Mia Chen joined as Mix engineer","Dec 31, 2025, 5:02 PM","by Sam Ortiz"],["Master v1 verified","Dec 31, 2025, 3:14 PM","5b7c2e90"],["First version uploaded","Dec 31, 2025, 3:14 PM","by Jordan Lee"]],"active":"Splits"},{"type":"text","body":["I turned screen recordings into HTML review documents with timestamp linked tasks: 97 issues across 11 areas, 83 resolved and 14 handed off as a clean list. A pixel perfect checklist documented every gap as what it is today and what it needs to be, with a Figma link and video, across web and mobile web. For tricky behavior like pagination, I prototyped the fix in code and handed engineering a working example."],"heading":"Closing the gap between Figma and production"},{"type":"chapter","label":"Impact"},{"type":"text","body":["Projects reached general availability on September 30, 2026, on every BeatStars plan including Free, five weeks after beta phase 2. In the first three weeks, creators made more than 1,700 new projects.","In Amplitude, task completion for the core flow, creating a project, adding files and editing its details, sits at 93%, and feedback on navigation and ease of use has been positive across the board."],"heading":"Live on every plan"},{"type":"list","items":[["Aug 25","Beta phase 2"],["Sep 1","Beta phase 3"],["Sep 9","Early public beta"],["Sep 30","General availability"]]},{"type":"text","body":["I keep refining the platform and bringing new tools to help music producers and creatives through their music and multimedia projects. I also set up a design review system for stakeholders, with one Figma page per initiative, prototype links shared a day ahead and walkthrough videos, and weekly design QA on everything I designed."],"heading":"After launch"},{"type":"text","body":["When frames stop answering questions, build it in code. And stay after handoff: the craft people feel is won in QA."],"heading":"What I took away"}],"links":[{"label":"BeatStars Projects","url":"https://www.beatstars.com/projects"}],"highlights":[{"value":"1,700+","label":"projects in three weeks"},{"value":"93%","label":"core task completion"},{"value":"Sep 30","label":"launch on every plan"}],"team":"PM and 4 engineers"},{"slug":"my-mixtapez","kind":"case","title":"My Mixtapez","client":"My Mixtapez","year":"2019","summary":"Leading a new visual language and the first design system for a hip hop streaming app with 14 million downloads.","outcomes":["60% faster to validation","+42% task success","+20% time in the player"],"role":"Head of Design","team":"Mobile and web developers","timeline":"9 months, 2018 to 2019","platform":"iOS and Android","locked":false,"cover":{"src":"assets/mm-cover.webp","alt":"My Mixtapez app screens: artist page, featured music, player, library and discover"},"blocks":[{"type":"chapter","label":"Context"},{"type":"text","heading":"A 14 million download app, built one screen at a time","body":["My Mixtapez is a streaming app for hip hop mixtapes, singles and albums. By 2018 it had grown screen by screen: almost nothing was reused, the interface looked dated, some flows led to dead ends, and the library was a single flat list of downloads.","At the time, design systems were still a new idea outside a handful of large tech companies, and most product teams designed one screen at a time. Proposing a new visual language and a shared system for a small team shipping on both iOS and Android was a big bet, and I led it."]},{"type":"image","src":"assets/mm-old-ui.webp","alt":"The old My Mixtapez music library: a red header with Albums and Favorites tabs over a flat list of songs","ratio":"16/10","caption":"The library before the redesign: two tabs and a flat list."},{"type":"text","heading":"My role","body":["I had designed the My Mixtapez brand and owned the app’s design since its early development at Vuziq, so as Head of Design I was rebuilding a product I knew from its first screen. I led the new visual language for the app and designed its design system and components, then worked with the iOS and Android developers to implement them. That execution and technical work was my main responsibility, and it is the focus of this case.","I also took part in the research and usability testing alongside the team, which shaped the navigation and library decisions below."]},{"type":"chapter","label":"Research"},{"type":"text","heading":"Listening to 450 people","body":["As a team, we ran a questionnaire through the app’s Instagram account, which had more than a million followers. Store reviews and interviews said the same things in different words: the app looked outdated, finding a song took too long, and people wanted playlists.","The answers shaped a persona and a map of how people add and play music. Listening itself worked well. The experience broke down the moment people tried to organize their music."]},{"type":"stats","items":[{"value":"450+","label":"survey responses"},{"value":"12","label":"usability test participants"},{"value":"4","label":"days testing in Atlanta"}]},{"type":"chapter","label":"Decisions"},{"type":"text","heading":"A design system, before it was the norm","body":["I defined a new visual language for the app and turned it into its first design system, built with atomic design: icons and inputs as atoms, rows and tabs as molecules, collection rails as organisms. Bebas Neue carries headlines and Open Sans carries everything people read, on a palette led by the brand red.","I designed the components and their states, and specified them so developers on both platforms could build from the same parts instead of recreating every screen. Every screen in the redesign, including the navigation and library below, was assembled from this system."]},{"type":"image","src":"assets/mm-system.webp","alt":"The My Mixtapez design system: color palette, Bebas Neue and Open Sans type specimens, and atom, molecule and organism components","ratio":"1800/3135","caption":"Colors, type and the first set of components."},{"type":"text","heading":"A stacked navigation","body":["Built on the new system, the navigation stacks content on top of where you came from, so going deeper and coming back always works the same way. The old structure had sent people sideways into screens they could not easily leave.","In usability testing, every participant completed every task. After launch, the share of users lost during a session dropped 28%."]},{"type":"image","src":"assets/mm-navigation.webp","alt":"New My Mixtapez navigation: discover, featured music, player and artist screens connected by flow lines","ratio":"2000/2081","caption":"Discover, featured music and the player, linked by the stacked navigation."},{"type":"text","heading":"Playlists in the library","body":["The most requested feature was the ability to make more than one list. Using the same components, the library gained playlists you can create, edit and share, plus search and filters across downloads.","“Finally, I can create more than one list of music” was the line we heard most in testing."]},{"type":"image","src":"assets/mm-library.webp","alt":"Before and after: the old Music Library with Albums and Favorites tabs, and the new My Music with playlists, downloads and search","ratio":"20/13","caption":"Before and after: one flat list, then playlists, downloads and search."},{"type":"chapter","label":"Impact"},{"type":"text","heading":"What changed","body":["The system changed how the team worked: taking a new layout from design to validation became 60% faster, and designers and developers could iterate on new ideas without breaking consistency.","In the A/B test against the old app, the new design lifted task success by 42% for downloading songs, adding to playlists and starting artist radio, and time in the player grew 20% after playlists launched."]},{"type":"quote","text":"It makes the development process way easier.","by":"Diogo, developer"},{"type":"quote","text":"It allows us to have more time to experiment and keep it consistent.","by":"André, designer"},{"type":"note","label":"A note on scope.","text":"The new interface, navigation and library shipped. The full implementation of the design system across both apps was still in progress when we left the company, so the complete system was never rolled out."}],"links":[{"label":"My Mixtapez on the App Store","url":"https://apps.apple.com/us/app/mymixtapez-playlists-24-7/id525781368"}],"highlights":[{"value":"60%","label":"faster to validation"},{"value":"+42%","label":"task success, A/B test"},{"value":"+20%","label":"time in the player"}]},{"slug":"stugo","kind":"case","title":"Stugo","client":"Stugo","year":"2023","summary":"A freelance engagement designing a studio booking platform end to end: the guest app from map to check in, and the dashboard studio owners use to run it.","outcomes":["Mobile app shipped in 4 to 5 months","Live on iOS and Android","Guest app and host dashboard"],"role":"Product Designer, freelance","team":"","timeline":"About 2 years","platform":"iOS, Android and web","locked":false,"cover":{"src":"assets/stugo-cover.webp","alt":"Stugo map screen with studio pins and floating cards for Beverly Hills Fitness and Gravity House West, beside the Stugo app icon"},"blocks":[{"type":"chapter","label":"Context"},{"type":"text","body":["Most studios still take bookings by phone. Finding one in a new city means searching maps, calling around and hoping the room has the gear you need.","Stugo puts studios of every kind in one place, from music and podcast rooms to yoga, dance, pottery and photography, with clear prices, equipment lists and reviews."],"heading":"Booking a studio still meant a phone call"},{"type":"text","body":["Stugo was a freelance engagement with a colleague’s startup. Over about two years I provided full product design: research and journey mapping, the guest app on iOS and Android, the web host dashboard and the Studio Host mobile app, working directly with the founder and the engineering team. The mobile app went from first design to published in four to five months."],"heading":"My role"},{"type":"chapter","label":"Research"},{"type":"text","body":["I mapped the journey from first hearing about a studio to coming back for another session. It surfaced the pain points the design had to answer: unreliable phone bookings, no trustworthy app for this, and being asked to create an account before you can even look."],"heading":"Mapping where booking breaks"},{"type":"image","src":"assets/stugo-journey.webp","alt":"Customer journey map across awareness, consideration, research, acquisition and loyalty, with actions, touch points, pain points, expectations and an emotion curve","ratio":"137/79","caption":"The journey map, from awareness to loyalty."},{"type":"chapter","label":"Decisions"},{"type":"text","heading":"A short answer to every break","body":["Each step of the guest app answers a pain point from the journey map, and the flow stays short on purpose: get in, find a room, book it, show up."]},{"type":"list","items":[["Sign in","A phone number and a texted code, no password. The same screen asks whether you want to book a studio or list one, so guests and hosts start from one door."],["Onboarding","Three screens that cover only the core loop: find, book, check in."],["Discovery","Categories and nearby studios, or a map with price per hour, rating and distance for when you are somewhere new."],["Booking","Rules, equipment and hourly extras like a sound engineer or a vintage Strat, with every line itemized before you confirm."],["Check in","A reminder 15 minutes before, then a short code shown at the studio. No paperwork, no front desk lookup."]]},{"type":"image","src":"assets/stugo-discovery.webp","alt":"Stugo home with categories and featured studios, a studio page with rooms, the map view with studio pins, and a category list","ratio":"16/10","caption":"Discovery by list or by map."},{"type":"image","src":"assets/stugo-booking.webp","alt":"Booking flow: room details, extra equipment and amenities with hourly prices, booking overview with a cost breakdown, and a confirmation","ratio":"16/10","caption":"Every line priced before you confirm."},{"type":"image","src":"assets/stugo-checkin.webp","alt":"Check in: a lock screen notification, a check in code screen showing ABC 5124, and a check in confirmed screen","ratio":"16/10","caption":"Check in with a code."},{"type":"chapter","label":"Studio owners"},{"type":"text","body":["Studio owners needed the same clarity. I designed the host dashboard for managing several studios and rooms, bookings, earnings and session files, and a companion Studio Host mobile app."],"heading":"The same clarity for hosts"},{"type":"image","src":"assets/stugo-host-dashboard.webp","alt":"Stugo host dashboard with studio cards, net earnings, current balance, open disputes and a bookings calendar","ratio":"2/1"},{"type":"image","src":"assets/stugo-host-app.webp","alt":"Studio Host mobile app screens: messages, rooms, studio overview, earnings and bookings list","ratio":"24/11"},{"type":"chapter","label":"Impact"},{"type":"text","body":["Stugo is live on iOS and Android, and on the web for hosts. The founder praised how clean the product looks and how well it works, and the developer credited the clear guidance and support during implementation. The same design language carries across the guest app, the host dashboard and the host app, so new features slot into one system instead of three."],"heading":"Live on three platforms"}],"links":[{"label":"Stugo on the App Store","url":"https://apps.apple.com/us/app/studio-booking-stugo/id1525785159"}],"highlights":[{"value":"4 to 5 mo","label":"mobile app to stores"},{"value":"3","label":"products, one language"},{"value":"~2 yrs","label":"freelance, end to end"}]},{"slug":"figma-plugins","kind":"lab","title":"Figma plugins","summary":"Component and variable swapping for library migrations","year":"2026","role":"Designer and builder","platform":"Figma","locked":false,"blocks":[{"type":"text","heading":"Component Library Swapper","body":["Migrates component instances from an old library version to a new one. Libraries live on cards with edit function nowPlaying(){
  const L = (S.listening || []).filter(t => t.art), mark = document.querySelector('#foot .foot-l');
  if (!L.length || !mark) return;
  const secs = s => s.split(':').reduce((m,v)=>m*60+(+v),0);
  const el = document.createElement('div'); el.className = 'np playing'; el.tabIndex = 0; el.setAttribute('role','group'); el.setAttribute('aria-label','What I am listening to');
  el.innerHTML = '<span class="np-bg"></span><span class="np-art" aria-hidden="true"><span class="np-vin"><span class="np-lbl"></span></span><span class="np-slv"></span></span><span class="np-txt"><small><span class="np-eq" aria-hidden="true"><i></i><i></i><i></i></span>Listening to</small><span class="np-line"><span></span></span></span>'
    + '<div class="np-card"><span class="np-bg"></span><div class="np-hd"><span class="np-cover"></span><span class="np-meta"><small>Now playing</small><b class="np-mq"></b><span class="np-ar"></span><span class="np-al"></span></span></div></div>';
  mark.replaceWith(el);
  const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { el.classList.add('np-in'); io.disconnect(); } }, {threshold:.6}); io.observe(el);
  let i = Math.floor(Math.random()*L.length), t = 0;
  const $ = q => el.querySelector(q);
  const load = () => {
    const tr = L[i], bg = 'url('+tr.art+')'; el.style.setProperty('--art', bg);
    $('.np-lbl').style.backgroundImage = bg; $('.np-slv').style.backgroundImage = bg; $('.np-cover').style.backgroundImage = bg;
    const two = h => '<span>'+h+'</span><span>'+h+'</span>';
    const line = $('.np-line'), txt = '<b>'+esc(tr.title)+'</b> <em>· '+esc(tr.artist)+'</em>';
    line.innerHTML = two(txt); line.classList.add('run'); line.style.setProperty('--d', Math.max(12, (tr.title.length + tr.artist.length)*0.55)+'s');
    const tb = $('.np-meta b'); tb.innerHTML = '<span>'+esc(tr.title)+'</span>'; tb.classList.remove('run');
    const fit = () => { if (!tb.classList.contains('run') && tb.firstElementChild.scrollWidth > tb.clientWidth + 1) { tb.innerHTML = two(esc(tr.title)); tb.style.setProperty('--d', Math.max(10, tr.title.length*0.5)+'s'); tb.classList.add('run'); } };
    requestAnimationFrame(fit); el.onmouseenter = fit;
    $('.np-ar').textContent = tr.artist; $('.np-al').textContent = tr.album === tr.title ? '' : tr.album;
  };
  t = Math.floor(secs(L[i].time) * (0.15 + Math.random()*0.6)); load();
  setInterval(() => { if (++t >= secs(L[i].time)) { i = (i + 1) % L.length; t = 0; load(); } }, 1000);
  el.addEventListener('click', () => el.classList.toggle('open'));
  document.addEventListener('click', e => { if (!el.contains(e.target)) el.classList.remove('open'); });
}

/* locked cases: blocks are AES encrypted at build time and decrypted here with the password */
function gate(p){
  const saved = ss.get('k:'+p.slug);
  if (saved) { unlock(p, saved, true); return; }
  document.getElementById('gateSlot').innerHTML = '<div class="gate" id="gate"><h2>'+LOCK+'The full case study is password protected</h2><p>It includes work under NDA. Enter the password I sent you, or email '+esc(S.email)+' to ask for one.</p>'+
    '<form id="gf" autocomplete="off"><label for="pw">Password</label><input id="pw" type="password" required><button class="btn" id="gb" type="submit">Unlock</button></form><span class="err" id="ge" hidden></span></div>';
  document.getElementById('gf').addEventListener('submit', e => { e.preventDefault(); unlock(p, document.getElementById('pw').value, false); });
}
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(x, pw){
  const k0 = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(x.salt), iterations:x.iter, hash:'SHA-256'}, k0, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(x.iv)}, k, b64(x.ct))));
}
async function unlock(p, pw, silent){
  const btn = document.getElementById('gb'); if (btn) { btn.disabled = true; btn.textContent = 'Checking'; }
  try {
    const blocks = await decrypt(p.sealed, pw);
    ss.set('k:'+p.slug, pw);
    const slot = document.getElementById('gateSlot');
    if (slot) slot.remove();
    const out = document.getElementById('lockedOut'); if (out) out.outerHTML = chapters(blocks, 'fade');
    bind();
  } catch(e) {
    if (silent) { ss.del('k:'+p.slug); gate(p); return; }
    const g = document.getElementById('gate'), er = document.getElementById('ge');
    er.hidden = false; er.textContent = 'That password did not work. Check it and try again.';
    g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
    btn.disabled = false; btn.textContent = 'Unlock'; document.getElementById('pw').select();
  }
}

function pvAim(e){
  const w = 280, h = pv.offsetHeight || 210, gap = 18;
  let x = e.clientX + gap, y = e.clientY + gap;
  if (x + w > innerWidth - 12) x = e.clientX - w - gap;
  if (y + h > innerHeight - 12) y = e.clientY - h - gap;
  pvT = {x, y};
}
function pvShow(el, e){
  const d = PV[el.dataset.pv]; if (!d || !fine.matches) return;
  const media = d.media && (d.media.src || S.draft) ? img(d.media,'16/10') : '';
  if (!media) return;
  pv.innerHTML = media + '<div class="cap"><span>'+esc(d.label)+'</span><span>'+esc(d.host)+'</span></div>';
  pvAim(e); if (!pvOn) pvC = {...pvT};
  pvOn = true; pv.classList.add('on'); if (!raf) raf = requestAnimationFrame(pvLoop);
}
function pvHide(){ pvOn = false; pv.classList.remove('on'); }

function zoomOpen(el, gal){
  if (document.querySelector('.zoom-img')) return;
  pvHide();
  const bg = document.createElement('div'), z = new Image(), cap = document.createElement('p'), nav = [];
  bg.className = 'zoom-bg'; z.className = 'zoom-img'; cap.className = 'zoom-cap';
  let i = gal ? gal.i : 0, cur = el;
  const capText = () => gal ? gal.items[i].cap : ((cur.closest('.fig') || {}).querySelector?.('figcaption')?.textContent || '');
  const place = q => Object.assign(z.style, {left:q.left+'px', top:q.top+'px', width:q.width+'px', height:q.height+'px'});
  const fit = () => {
    const m = Math.max(20, Math.min(innerWidth, innerHeight) * .04), side = gal && innerWidth > 640 ? 72 : 0, room = cap.textContent ? 44 : 0;
    const nw = +cur.dataset.w || cur.naturalWidth, nh = +cur.dataset.h || cur.naturalHeight;
    const s = Math.min((innerWidth - 2*m - 2*side) / nw, (innerHeight - 2*m - room) / nh, 1);
    const w = nw * s, h = nh * s, q = {left:(innerWidth-w)/2, top:(innerHeight-h-room)/2, width:w, height:h};
    cap.style.top = (q.top + h + 14) + 'px'; return q;
  };
  const frame = () => z.classList.toggle('framed', !/\.png(\?|#|$)/i.test(z.src));
  const hires = e => { const full = e.getAttribute('src'); if (!full || (e.currentSrc || '').endsWith(full)) return; const hi = new Image(); hi.onload = () => { if (cur === e && z.isConnected) z.src = full; }; hi.src = full; };
  const go = d => {
    i = (i + d + gal.items.length) % gal.items.length; cur = gal.items[i].el(); gal.onChange && gal.onChange(i);
    z.classList.add('swap'); cap.classList.add('swap');
    setTimeout(() => { z.src = cur.currentSrc || cur.src; hires(cur); z.alt = cur.alt; frame(); cap.textContent = capText(); place(fit()); z.classList.remove('swap'); cap.classList.remove('swap'); }, reduced.matches ? 0 : 140);
  };
  if (gal) [['l',-1,'Previous image',AL],['r',1,'Next image',AR]].forEach(([k,d,label,ico]) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'zoom-nav '+k; b.setAttribute('aria-label', label); b.innerHTML = ico; b.onclick = e => { e.stopPropagation(); go(d); }; nav.push(b); });
  z.src = el.currentSrc || el.src; hires(el); z.alt = el.alt; frame(); cap.textContent = capText();
  place(el.getBoundingClientRect()); document.body.append(bg, z, cap, ...nav);
  requestAnimationFrame(() => requestAnimationFrame(() => { [bg, cap, ...nav].forEach(x => x.classList.add('on')); place(fit()); }));
  const close = () => {
    removeEventListener('keydown', key); removeEventListener('scroll', close);
    [bg, cap, ...nav].forEach(x => x.classList.remove('on')); place(cur.getBoundingClientRect());
    setTimeout(() => { [bg, z, cap, ...nav].forEach(x => x.remove()); cur.focus({preventScroll:true}); }, reduced.matches ? 0 : 430);
  };
  const key = e => { if (e.key === 'Escape') close(); else if (gal && e.key === 'ArrowRight') go(1); else if (gal && e.key === 'ArrowLeft') go(-1); };
  bg.addEventListener('click', close); z.addEventListener('click', close);
  addEventListener('keydown', key); addEventListener('scroll', close, {once:true, passive:true});
}

function bind(){
  const who = document.querySelector('.who'), av = who && who.querySelector('.av');
  if (av && !who._t) { who._t = 1; who.addEventListener('pointermove', e => { const r = av.getBoundingClientRect(); const d = (e.clientX - (r.left + r.width/2)) / Math.max(innerWidth/2, 1); av.style.setProperty('--rx', (Math.max(-1, Math.min(1, d)) * 6).toFixed(2)+'deg'); }); who.addEventListener('pointerleave', () => av.style.setProperty('--rx','0deg')); }
  document.querySelectorAll('.img img:not(.ld)').forEach(el => { const on = () => el.classList.add('ld'); if (el.complete && el.naturalWidth) on(); else { el.addEventListener('load', on, {once:true}); el.addEventListener('error', on, {once:true}); } });
  bindCmp(); bindItv(); bindRec();
  document.querySelectorAll('.fig .img img').forEach(el => {
    if (el._zm || el.closest('a')) return; el._zm = 1;
    el.tabIndex = 0; el.setAttribute('role', 'button'); el.setAttribute('aria-label', 'Enlarge image: ' + el.alt);
    el.addEventListener('click', () => { const g = el.closest('[data-itv]'); g && g._gal ? zoomOpen(el, g._gal()) : zoomOpen(el); });
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); zoomOpen(el); } });
  });
  document.querySelectorAll('[data-pv]').forEach(el => {
    if (el._pv) return; el._pv = 1;
    el.addEventListener('pointerenter', e => pvShow(el, e));
    el.addEventListener('pointermove', e => { if (pvOn) pvAim(e); });
    el.addEventListener('pointerleave', pvHide);
  });
  document.querySelectorAll('.sel').forEach(s => {
    if (s._sel) return; s._sel = 1;
    const host = s.closest('.card') || s;
    const size = () => { const r = s.querySelector('.img').getBoundingClientRect(); s.querySelector('.dim').textContent = Math.round(r.width)+' × '+Math.round(r.height); };
    host.addEventListener('pointerenter', size); host.addEventListener('focus', size);
  });
  document.querySelectorAll('[data-copy]').forEach(b => {
    if (b._cp) return; b._cp = 1;
    b.addEventListener('click', () => {
      const st = b.querySelector('[data-copy-state]');
      const ok = () => { st.textContent = 'Copied'; setTimeout(() => st.textContent = 'Copy', 1600); };
      const sel = () => { const r = document.createRange(); r.selectNodeContents(b.firstChild); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
      try { navigator.clipboard.writeText(S.email).then(ok, sel); } catch(e) { sel(); }
    });
  });
}

/* theme: follows the system until the visitor picks one */
const root = document.documentElement;
const dark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
const themeBtn = document.getElementById('themeBtn');
const paintBtn = () => { document.querySelectorAll('meta[name=theme-color]').forEach(m => { if (root.dataset.theme) m.removeAttribute('media'); m.content = getComputedStyle(root).getPropertyValue('--frame').trim(); }); themeBtn.innerHTML = dark() ? SUN : MOON; themeBtn.setAttribute('aria-label', dark() ? 'Switch to light theme' : 'Switch to dark theme'); };
const savedTheme = ls.get('theme'); if (savedTheme === 'dark' || savedTheme === 'light') root.dataset.theme = savedTheme;
themeBtn.addEventListener('click', () => { const next = dark() ? 'light' : 'dark'; vt(() => { root.dataset.theme = next; paintBtn(); }); ls.set('theme', next); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintBtn);
paintBtn();

/* routing with shared element transitions; home keeps its scroll position */
/* returning home lands exactly where the visitor left (or on the section they asked for), inside the same view transition, so the case title morphs back into its card instead of the page jumping to the top and scrolling */
let homeY = 0, current = '', fromHome = false, goTo = '';
function view(){
  const p = P.find(x => x.slug === location.hash.slice(1) && !x.url);
  if (p) { if (current === 'home') { homeY = scrollY; fromHome = true; } else fromHome = false; renderCase(p); scrollTo(0, 0); }
  else {
    const back = current && current !== 'home'; renderHome();
    const t = goTo && document.getElementById(goTo); goTo = '';
    if (t) t.scrollIntoView({block:'start'}); else scrollTo(0, back ? homeY : 0);
    fromHome = false;
  }
  current = p ? p.slug : 'home';
  crumbs(p);
}
function crumbs(p){
  const SEP = '<svg class="sep" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6h7M6.5 3l3 3l-3 3"/></svg>';
  const el = document.getElementById('crumbs');
  if (!p) { el.innerHTML = '<span aria-current="page">'+esc(S.name)+'</span>'; return; }
  const sec = p.kind === 'lab' ? ['lab','Lab'] : ['work','Work'];
  const name = p.client && !p.title.startsWith(p.client) ? p.client+' '+p.title : p.title;
  el.innerHTML = '<a class="root" href="#" aria-label="Back to '+sec[1]+'"><span>'+sec[1]+'</span>'+SEP+'</a><span aria-current="page">'+esc(name)+'</span>';
  el.querySelector('a').onclick = e => { e.preventDefault(); home(fromHome ? '' : sec[0]); };
}
function route(){ pvHide(); const t = vt(view); if (t && t.finished) t.finished.catch(() => {}); }

/* leave a case: step back in history when the visitor came from home, so the back button stays clean */
function home(section){
  goTo = section || '';
  if (fromHome && !section && history.length > 1) history.back(); else location.hash = '';
}
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
  if (current !== 'home') return home(b.dataset.go);
  const el = document.getElementById(b.dataset.go); if (el) el.scrollIntoView({behavior: reduced.matches ? 'auto' : 'smooth', block:'start'});
}));

function renderFoot(){
  const t = () => new Intl.DateTimeFormat('en-CA', {hour:'numeric', minute:'2-digit', timeZone:'America/Edmonton'}).format(new Date());
  document.getElementById('foot').innerHTML = '<span class="foot-l"></span><span class="foot-r"><span>© '+new Date().getFullYear()+' '+esc(S.name)+'</span><small>'+esc(S.location)+' · <span id="clock">'+t()+'</span> local</small></span>';
  setInterval(() => { const c = document.getElementById('clock'); if (c) c.textContent = t(); }, 30000);
}

document.getElementById('draftBadge').hidden = !S.draft;
root.classList.add('boot');
renderFoot(); nowPlaying(); view();
setTimeout(() => root.classList.remove('boot'), 1400);
window.addEventListener('hashchange', route);
</script>
